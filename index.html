<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audyt SZBI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17212b;--mut:#5a6876;--line:#d3dae1;--acc:#0f4c81;--onacc:#fff;--ok:#1f7a45;--part:#b26a00;--bad:#b3261e;--na:#6b7885;--onst:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--ink:#e6ebf0;--mut:#9aa8b5;--line:#2c3945;--acc:#1d4f80;--ok:#4cc27c;--part:#e0a040;--bad:#ef7b73;--na:#8d9aa7;--onst:#0b1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--ink:#e6ebf0;--mut:#9aa8b5;--line:#2c3945;--acc:#1d4f80;--ok:#4cc27c;--part:#e0a040;--bad:#ef7b73;--na:#8d9aa7;--onst:#0b1218;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:var(--onacc);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:180px;font-weight:600}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--card);color:var(--acc);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--part);outline-offset:2px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;background:var(--card);color:var(--ink);border:2px solid var(--line);min-width:46px;padding:8px 12px}
nav button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
nav button.d{border-color:var(--ok)}nav button.c{border-color:var(--part)}nav button.b{border-color:var(--bad)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{margin:0 0 6px;font-size:21px}h3{margin:0 0 8px;font-size:18px}
.ref{color:var(--mut);font-size:14px}
.q{font-weight:600;margin:6px 0 10px}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.st label{border:2px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:center}
.st input{position:absolute;opacity:0;pointer-events:none}
.st label:has(input:checked){color:var(--onst);font-weight:600}
.s-T:has(input:checked){background:var(--ok);border-color:var(--ok)}
.s-C:has(input:checked){background:var(--part);border-color:var(--part)}
.s-N:has(input:checked){background:var(--bad);border-color:var(--bad)}
.s-X:has(input:checked){background:var(--na);border-color:var(--na)}
.th{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.th input{width:22px;height:22px;margin-top:2px;flex:none}
.ev{border-top:1px solid var(--line);padding:10px 0}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin:4px 0 8px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.gap{border-top:1px solid var(--line);padding:10px 0}
.mic{margin:4px 0 8px;border:2px solid var(--acc)}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 8px}
.pth{padding:0;width:76px;height:76px;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.cam{cursor:pointer}
.pv{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.pv img{max-width:100%;max-height:78vh;object-fit:contain}
.pvb{display:flex;gap:10px}
.pvb .bad{background:var(--bad);color:#fff}
.phr{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.phr img{width:200px;max-width:45%;border:1px solid var(--line);border-radius:6px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
main button{border:2px solid var(--acc)}
details.card>summary{font-weight:600;font-size:18px;cursor:pointer;padding:4px 0}
.cnt{color:var(--mut);font-weight:400;font-size:15px;margin-left:6px}
.row{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line)}
.row .th{border-top:0;flex:1}
.grow{flex:1;padding:6px 0}
.hb{flex:none;width:42px;height:42px;border-radius:50%;padding:0;border:2px solid var(--acc);background:var(--card);color:var(--acc);margin-top:4px}
.hbox{background:var(--bg);border-left:4px solid var(--acc);border-radius:6px;padding:10px 12px;margin:4px 0 8px;white-space:pre-wrap;font-size:16px}
.hbox .ask{display:flex;gap:6px;margin-top:8px;white-space:normal}.hbox .ask input{margin:0}
.nohint .hb{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:14px;font-weight:400}
.tile b{font-size:17px}.tile .bar{display:block}
.tile.d{border-color:var(--ok)}.tile.c{border-color:var(--part)}.tile.b{border-color:var(--bad)}
.back{margin-bottom:12px}
.pri{background:var(--acc);color:var(--onacc);width:100%;padding:14px;font-size:18px}
.btn{display:inline-block;background:var(--card);color:var(--acc);border:2px solid var(--acc);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20}
@media (max-width:560px){.g3{grid-template-columns:1fr}}
@media print{header,nav,.noprint{display:none}body::before{display:none}body{background:#fff;color:#000}.card{border-color:#999;break-inside:avoid}}
</style>
</head>

var S=[['T','Zgodne'],['C','Częściowo'],['N','Niezgodne'],['X','Nie dotyczy']];

// Obszar: [nr, nazwa, rozmówca, czas, wątki, dowody, wymagania [treść, odniesienia]]
var AR=[
["1", "Rozmowa otwierająca z Zarządem", "Prezes / Zarząd", "20–30 min", ["Profil działalności, skala, lokalizacje, kluczowe procesy", "Powód wdrożenia i oczekiwany termin certyfikacji", "Najcenniejsze informacje i najgorszy scenariusz", "Kto prowadzi system i ile ma na to czasu", "Zasoby: ludzie, budżet, wsparcie zewnętrzne", "Doświadczenia: incydenty, audyty klientów, wymagania umów", "Inne systemy zarządzania i integracja dokumentacji"], ["Schemat organizacyjny", "Wykaz lokalizacji i obiektów", "Polityka Bezpieczeństwa Informacji", "Powołanie Pełnomocnika ds. SZBI", "Harmonogram projektu wdrożenia", "Certyfikaty innych systemów zarządzania"], [["Czy zrozumiano kontekst organizacji, czyli czynniki wewnętrzne i zewnętrzne istotne dla bezpieczeństwa informacji?", "ISO 4.1 | NIS2 21(1)"], ["Czy określono strony zainteresowane i ich wymagania, w tym prawne (KSC, NIS2, RODO) i umowne?", "ISO 4.2 | KSC art. 8"], ["Czy najwyższe kierownictwo wykazuje przywództwo: włącza SZBI w procesy, zapewnia zasoby i komunikuje wagę bezpieczeństwa?", "ISO 5.1, 7.1 | NIS2 art. 20(1)"], ["Czy polityka bezpieczeństwa informacji jest zatwierdzona przez kierownictwo, zawiera cele lub ramy ich ustalania oraz zobowiązania i została zakomunikowana?", "ISO 5.2 | KSC art. 8 ust. 1 pkt 2 lit. a | NIS2 21(2)(a)"], ["Czy kierownictwo wymaga od personelu stosowania zasad bezpieczeństwa i samo ich przestrzega?", "ISO A.5.4"], ["Czy kierownik podmiotu ponosi udokumentowaną odpowiedzialność za wykonanie obowiązków z ustawy i zatwierdza środki zarządzania ryzykiem?", "KSC art. 8c ust. 1 | NIS2 art. 20(1)"], ["Czy kierownik przechodzi coroczne szkolenie z cyberbezpieczeństwa, a udział jest udokumentowany?", "KSC art. 8e ust. 1-3 | NIS2 art. 20(2)"], ["Czy wyznaczono co najmniej dwie osoby kontaktowe w sprawach cyberbezpieczeństwa i czy ich dane w Wykazie KSC są aktualne?", "KSC art. 9"], ["Czy środki bezpieczeństwa i dokumentacja są przeglądane co najmniej raz w roku i aktualizowane po zmianach ryzyka?", "KSC art. 10"], ["Czy przegląd zarządzania odbywa się w planowanych odstępach, z wymaganymi wejściami i udokumentowanymi decyzjami?", "ISO 9.3"], ["Czy program audytów wewnętrznych jest zaplanowany, a audytorzy są obiektywni i bezstronni?", "ISO 9.2 | NIS2 21(2)(f)"], ["Czy bezpieczeństwo informacji jest niezależnie przeglądane w planowanych odstępach i po istotnych zmianach, w tym audytem bezpieczeństwa?", "ISO A.5.35 | KSC art. 15 ust. 1"], ["Czy zgodność z politykami, zasadami i normami bezpieczeństwa jest regularnie sprawdzana przez kierowników?", "ISO A.5.36"], ["Czy zidentyfikowano wymagania prawne, regulacyjne i umowne dotyczące bezpieczeństwa informacji oraz sposób ich spełniania?", "ISO A.5.31"], ["Czy monitoruje się skuteczność SZBI: co mierzyć, jak, kiedy i kto ocenia wyniki?", "ISO 9.1 | KSC art. 8 ust. 1 pkt 2 lit. h | NIS2 21(2)(f)"], ["Czy niezgodności są rejestrowane, usuwane u źródła i weryfikowane pod kątem skuteczności, a SZBI jest ciągle doskonalony?", "ISO 10.1, 10.2"]]],
["2", "Zakres i dokumentacja SZBI", "Pełnomocnik ds. SZBI", "40–45 min", ["Zakres: lokalizacje, procesy, systemy i co poza nim", "Dokumenty istniejące i planowane", "Oznaczanie, zatwierdzanie i rozpowszechnianie dokumentów", "Skąd pracownik wie, że ma wersję obowiązującą", "Deklaracja Stosowania: podstawa i autor", "Zapisy: gdzie i jak długo przechowywane"], ["Dokument zakresu SZBI", "Wykaz dokumentacji z symbolami i wersjami", "Polityki i procedury (komplet lub lista)", "Deklaracja Stosowania (SoA)", "Dowód zapoznania pracowników z dokumentacją", "Zasady archiwizacji i okresy retencji"], [["Czy zakres SZBI jest określony i udokumentowany, z uwzględnieniem kontekstu, wymagań, interfejsów i zależności?", "ISO 4.3 | KSC art. 8 ust. 1"], ["Czy SZBI jest ustanowiony, wdrożony, utrzymywany i ciągle doskonalony wraz z potrzebnymi procesami?", "ISO 4.4 | KSC art. 8 ust. 1"], ["Czy istnieje Deklaracja Stosowania z uzasadnieniem włączenia i wyłączenia każdego zabezpieczenia oraz stanem wdrożenia?", "ISO 6.1.3(d)"], ["Czy informacje udokumentowane są tworzone, aktualizowane i nadzorowane (oznaczenie, wersja, zatwierdzenie, dostępność, ochrona)?", "ISO 7.5"], ["Czy poza polityką ogólną obowiązują polityki tematyczne (dostęp, kryptografia, kopie, czyste biurko itd.) i są przekazane personelowi?", "ISO A.5.1 | KSC art. 8 ust. 1 pkt 2 lit. a"], ["Czy procedury operacyjne są udokumentowane i dostępne dla osób, które ich potrzebują?", "ISO A.5.37"], ["Czy zapisy (wyniki audytów, szkolenia, incydenty) są chronione przed utratą, zniszczeniem i fałszerstwem oraz mają okresy retencji?", "ISO A.5.33"], ["Czy zmiany w SZBI są planowane i wprowadzane w kontrolowany sposób?", "ISO 6.3"], ["Czy procesy SZBI są planowane, wdrażane i nadzorowane, a zmiany kontrolowane, w tym procesy zlecane na zewnątrz?", "ISO 8.1"], ["Czy sprawdzono, czy podmiot jest dostawcą objętym rozporządzeniem wykonawczym Komisji 2024/2690 (np. DNS, chmura, centra danych, usługi zarządzane, platformy)?", "Rozp. (UE) 2024/2690 | KSC art. 8"], ["Czy podmiot ważny będący podmiotem publicznym stosuje uproszczony SZBI według załącznika nr 4 do ustawy i go dokumentuje?", "KSC załącznik nr 4"]]],
["3", "Aktywa informacyjne i ryzyko", "Pełnomocnik ds. SZBI", "30–40 min", ["Spis aktywów i ich właściciele", "Metodyka ryzyka i kryteria akceptacji", "Kiedy była analiza i kto uczestniczył", "Najwyższe ryzyka i decyzje o nich", "Plan postępowania: terminy, osoby, postęp", "Cele bezpieczeństwa i sposób sprawdzania ich osiągnięcia"], ["Rejestr aktywów informacyjnych", "Metodyka lub procedura analizy ryzyka", "Rejestr ryzyk", "Plan postępowania z ryzykiem", "Kryteria akceptacji ryzyka z zatwierdzeniem", "Karta celów SZBI"], [["Czy zaplanowano działania wobec ryzyk i szans, w tym kryteria oceny ryzyka?", "ISO 6.1.1 | KSC art. 8 ust. 1 pkt 1"], ["Czy ryzyko jest szacowane według udokumentowanej metodyki z kryteriami akceptacji i spójnymi wynikami?", "ISO 6.1.2 | KSC art. 8 ust. 1 pkt 1 | NIS2 21(2)(a)"], ["Czy wybrano opcje postępowania z ryzykiem, określono zabezpieczenia, plan postępowania i uzyskano akceptację ryzyka szczątkowego?", "ISO 6.1.3"], ["Czy ocena ryzyka jest przeprowadzana w planowanych odstępach i po istotnych zmianach?", "ISO 8.2 | KSC art. 10"], ["Czy plan postępowania z ryzykiem jest realizowany, a wyniki udokumentowane?", "ISO 8.3"], ["Czy określono cele bezpieczeństwa informacji, które są mierzalne, monitorowane i komunikowane?", "ISO 6.2"], ["Czy prowadzona jest ewidencja informacji i innych aktywów z właścicielami?", "ISO A.5.9 | KSC art. 8 ust. 1 pkt 2 lit. m | NIS2 21(2)(i)"], ["Czy zasady dopuszczalnego użycia informacji i aktywów są określone, udokumentowane i wdrożone?", "ISO A.5.10"], ["Czy informacje są klasyfikowane według wymagań ochrony i chronione odpowiednio do klasy?", "ISO A.5.12 | KSC art. 8 ust. 1 pkt 5 lit. a"], ["Czy informacje są oznaczane zgodnie z przyjętym schematem klasyfikacji?", "ISO A.5.13"], ["Czy bezpieczeństwo informacji jest uwzględniane w zarządzaniu projektami?", "ISO A.5.8"], ["Czy chroniona jest prywatność i dane osobowe zgodnie z wymaganiami prawa?", "ISO A.5.34"]]],
["4", "Ludzie, kadry i świadomość", "Kadry / HR", "30 min", ["Weryfikacja kandydatów przed zatrudnieniem", "Poufność w umowach i NDA", "Wdrożenie pracownika: szkolenie i dostęp", "Szkolenia okresowe: zakres i częstotliwość", "Zakończenie współpracy: sprzęt, klucze, konta", "Praca zdalna i sprzęt prywatny", "Konsekwencje naruszeń i świadomość pracowników"], ["Wzór umowy z klauzulami o poufności", "Wzór umowy NDA", "Rejestr szkoleń i listy obecności", "Karta obiegowa przy zakończeniu współpracy", "Regulamin pracy (monitoring, konsekwencje)", "Zasady pracy zdalnej", "Upoważnienia do przetwarzania danych osobowych"], [["Czy role i odpowiedzialności za bezpieczeństwo informacji są określone, przydzielone i zakomunikowane?", "ISO 5.3, A.5.2 | KSC art. 8 ust. 1 pkt 2 lit. d | NIS2 21(2)(i)"], ["Czy kolidujące obowiązki i obszary odpowiedzialności są rozdzielone?", "ISO A.5.3"], ["Czy kandydaci są weryfikowani przed zatrudnieniem, proporcjonalnie do ryzyka, a niekaralność sprawdzana jest tam, gdzie wymaga tego ustawa?", "ISO A.6.1 | KSC (weryfikacja niekaralności personelu)"], ["Czy warunki zatrudnienia i umowy określają obowiązki w zakresie bezpieczeństwa informacji?", "ISO A.6.2"], ["Czy personel ma kompetencje wymagane do zadań bezpieczeństwa, a luki są uzupełniane?", "ISO 7.2"], ["Czy personel jest świadomy polityki, swojego wkładu i skutków niezgodności?", "ISO 7.3"], ["Czy zasady komunikacji dotyczącej SZBI (co, kiedy, kto, komu, jak) są określone?", "ISO 7.4"], ["Czy personel przechodzi regularne szkolenia i edukację z cyberbezpieczeństwa (zagrożenia, reagowanie, konsekwencje), z zapisami?", "ISO A.6.3 | KSC art. 8 ust. 1 pkt 2 lit. i | NIS2 21(2)(g)"], ["Czy wdrożono podstawowe zasady cyberhigieny i czy personel je stosuje?", "KSC art. 8 ust. 1 pkt 2 lit. j | NIS2 21(2)(g)"], ["Czy istnieje formalny proces dyscyplinarny wobec naruszeń bezpieczeństwa i czy personel o nim wie?", "ISO A.6.4"], ["Czy obowiązki bezpieczeństwa po zakończeniu lub zmianie zatrudnienia są ok var SR=window.SpeechRecognition||window.webkitSpeechRecognition,REC=null,ACT=null;

function addText(id,txt){var el=document.getElementById(id);if(!el||!txt)return;el.value+=(el.value&&!/\s$/.test(el.value)?' ':'')+txt;el.dispatchEvent(new Event('input',{bubbles:true}))}
function micReset(){if(ACT)ACT.b.textContent=ACT.b.dataset.l;ACT=null}
function micStop(){var r=REC;REC=null;if(r){try{r.stop()}catch(e){}}if(DICT&&ACT){try{DICT.stop()}catch(e){}}micReset()}
function micToggle(b){var id=b.dataset.mic;if(ACT){var same=ACT.id===id;micStop();if(same)return}
ACT={id:id,b:b};b.textContent='Zatrzymaj dyktowanie';
if(DICT){DICT.start().catch(function(){toast('Nie można uruchomić dyktowania.');micReset()})}
else if(SR){var rec=new SR();REC=rec;rec.lang='pl-PL';rec.continuous=true;rec.interimResults=false;
rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)addText(id,e.results[i][0].transcript.trim())};
rec.onerror=function(e){REC=null;toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Brak zgody na mikrofon.':'Dyktowanie przerwane.');micReset()};
rec.onend=function(){if(REC===rec){try{rec.start()}catch(e){REC=null;micReset()}}};
try{rec.start()}catch(e){REC=null;micReset();toast('Nie można uruchomić dyktowania.')}}
else micReset()}
var HT={"1": {"t": ["Ustal, jakie usługi świadczy firma, ilu ma pracowników i gdzie działa. Od tego zależy zakres SZBI oraz status podmiotu. Zapytaj: które procesy zatrzymałyby firmę, gdyby stanęły na dobę?", "Sprawdź, czy motywem jest wymóg prawny (KSC), klient czy własna decyzja. Termin porównaj z zasobami: podmioty istniejące mają wdrożyć SZBI do 3 kwietnia 2027, a podmioty kluczowe przejść pierwszy audyt do 3 kwietnia 2028. Sygnał ostrzegawczy: termin bez harmonogramu.", "Poproś Zarząd o wskazanie trzech najcenniejszych zbiorów informacji i najgorszego scenariusza. Te odpowiedzi powinny później zgadzać się z rejestrem aktywów i analizą ryzyka. Rozbieżność oznacza, że ryzyko oceniono bez udziału zarządu.", "Zapytaj, kto jest Pełnomocnikiem ds. SZBI, ile godzin tygodniowo na to przeznacza i kto go zastępuje. Sygnał ostrzegawczy: rola dopisana do pełnego etatu, bez czasu i bez zastępcy.", "Sprawdź, czy jest budżet na narzędzia, szkolenia, testy i wsparcie zewnętrzne oraz kto zatwierdza wydatki na bezpieczeństwo. Kierownictwo ma zapewnić zasoby (ISO 7.1).", "Zbierz informacje o incydentach, audytach klientów i wymaganiach z umów. To wejście do analizy ryzyka i listy wymagań stron zainteresowanych. Zapytaj o wymagania klientów, których firma dziś nie umie wykazać.", "Ustal, czy działają ISO 9001, 14001 lub inne systemy. Wspólne elementy (nadzór nad dokumentami, audyty wewnętrzne, przegląd zarządzania, działania korygujące) można zintegrować zamiast dublować."], "e": ["Pokazuje role i podległość oraz miejsce Pełnomocnika. Sprawdź, czy jest aktualny (data, wersja) i czy Pełnomocnik ma dostęp do zarządu.", "Potrzebny do ustalenia zakresu i bezpieczeństwa fizycznego. Upewnij się, że obejmuje biura, magazyny, serwerownie i lokalizacje zdalne.", "Sprawdź zatwierdzenie przez najwyższe kierownictwo, datę, zobowiązanie do spełnienia wymagań i ciągłego doskonalenia oraz czy pracownicy ją znają (ISO 5.2).", "Szukaj pisemnego dokumentu z zakresem uprawnień i odpowiedzialności, podpisanego przez zarząd. Wzmianka w mailu to za mało.", "Sprawdź etapy, terminy, odpowiedzialnych i kamienie milowe. Oceń realność względem zasobów i terminu certyfikacji.", "Aktualne certyfikaty wskażą dojrzałość zarządzania i elementy do integracji. Sprawdź ważność i zakres certyfikacji."], "r": ["Szukaj udokumentowanej analizy kontekstu (np. SWOT, PESTLE) aktualizowanej po istotnych zmianach, a nie jednorazowego slajdu.", "Poproś o rejestr stron z wymaganiami i właścicielem. Powinien obejmować klientów, organy nadzoru i dostawców.", "Szukaj śladów decyzji: budżet, protokoły, komunikaty do pracowników. Deklaracja bez zasobów to uchybienie.", "Sprawdź podpis, datę, zobowiązanie do spełnienia wymagań i doskonalenia oraz dowód, że pracownicy ją znają.", "Zapytaj o przykłady egzekwowania zasad. Sygnał ostrzegawczy: wyjątki dla zarządu od reguł obowiązujących wszystkich.", "Odpowiedzialności nie można delegować, zadania tak. Szukaj zatwierdzenia środków przez kierownika i nadzoru nad ich wdrożeniem.", "Sprawdź zaświadczenie lub listę obecności z bieżącego roku kalendarzowego oraz zakres szkolenia.", "Zmiany danych w Wykazie zgłasza się w ciągu 14 dni. Sprawdź zastępstwa na czas urlopów.", "Szukaj protokołu rocznego przeglądu i listy zaktualizowanych dokumentów.", "Wejścia: status działań, zmiany kontekstu, wyniki monitorowania i audytów, niezgodności, opinie stron, ryzyka. Wyjście: decyzje i przydział zasobów.", "Sprawdź plan, kryteria, zakres, raporty oraz dowód, że audytor nie ocenia własnej pracy.", "Podmioty kluczowe: audyt co najmniej raz na 3 lata, pierwszy w ciągu 24 miesięcy, czyli do 3 kwietnia 2028 dla podmiotów istniejących. Wymagania wobec audytora zweryfikuj w ustawie.", "Szukaj przeglądów zgodności w działach i działań po stwierdzonych odchyleniach.", "Rejestr przepisów z właścicielem i datą przeglądu: KSC, RODO, umowy z klientami, przepisy sektorowe.", "Szukaj wskaźników, wyników pomiarów i wniosków z nich. Samo zbieranie danych bez oceny nie spełnia wymogu.", "Sprawdź rejestr: przyczyna, działanie korygujące, właściciel, termin, weryfikacja. Uchybienie: zamykanie bez oceny skuteczności."]}, "2": {"t": ["Zakres ma wskazywać lokalizacje, procesy i systemy oraz wyłączenia z uzasadnieniem. Zapytaj, co świadomie jest poza zakresem i dlaczego. Sygnał ostrzegawczy: zakres węższy niż systemy usług kluczowych.", "Poproś o listę dokumentów ze statusem: istnieje, w opracowaniu, brak. Pozwoli to zaplanować luki.", "Sprawdź jednolity system oznaczeń, wersje, datę, autora i osobę zatwierdzającą. Zapytaj, kto zatwierdza zmiany.", "Zapytaj pracownika, gdzie znajdzie politykę i skąd wie, że to najnowsza wersja. Dobra praktyka: jedno repozytorium i wycofane stare wersje.", "Zapytaj, kto i na jakiej podstawie ją wypełniał. SoA powinna wynikać z analizy ryzyka. Sygnał ostrzegawczy: wszystkie zabezpieczenia „stosowane” bez uzasadnień i dowodów.", "Ustal miejsce i okresy przechowywania zapisów (szkolenia, audyty, incydenty), kto ma do nich dostęp i jak są chronione przed zmianą."], "e": ["Sprawdź zatwierdzenie, granice, interfejsy i wyłączenia z uzasadnieniem (ISO 4.3).", "Spis z symbolami, wersjami i datami. Porównaj go z kilkoma losowo wybranymi dokumentami.", "Zwróć uwagę na polityki wymagane przez KSC: ryzyko, bezpieczeństwo systemu, kontrola dostępu, kryptografia, ciągłość. Sprawdź, czy są wdrożone, a nie tylko napisane.", "Dla każdego zabezpieczenia: stosowane lub nie, uzasadnienie, stan wdrożenia i powiązanie z ryzykiem (ISO 6.1.3). Szukaj wersji z datą zatwierdzenia.", "Oświadczenia, podpisy lub wpisy w systemie szkoleniowym z datą. Sprawdź próbę kilku pracowników, w tym nowych.", "Procedura i wykaz okresów retencji z uwzględnieniem wymagań prawnych. Sprawdź, gdzie fizycznie leżą zapisy."], "r": ["Zakres ma obejmować system informacyjny wykorzystywany w procesach usługi kluczowej lub ważnej. Szukaj wyłączeń z uzasadnieniem.", "Sprawdź, czy procesy SZBI faktycznie działają, a nie istnieją tylko w dokumentach.", "Wybierz losowo trzy zabezpieczenia i poproś o dowód wdrożenia. Niezgodne, gdy SoA jest przepisaną listą bez związku z ryzykiem.", "Sprawdź wykaz dokumentów, wersje i sposób wycofywania nieaktualnych.", "Porównaj listę polityk z wymaganiami KSC: ryzyko, bezpieczeństwo systemu, kontrola dostępu, kryptografia, ciągłość.", "Poproś administratora o instrukcję konkretnej czynności (np. odtworzenie kopii) i sprawdź, czy jest aktualna.", "Sprawdź wykaz zapisów, miejsce przechowywania, okresy i uprawnienia do zmian.", "Wymóg dodany zmianą normy z 2024 roku. Szukaj prostej procedury planowania zmian SZBI.", "Sprawdź kryteria procesów, nadzór nad zleconymi procesami i ocenę skutków zmian.", "Jeśli tak, rozporządzenie doprecyzowuje wymagania SZBI. Poproś o analizę kwalifikacji. Pozostali klienci: nie dotyczy.", "Dotyczy tylko takich podmiotów. Obowiązkowe: aktywa, ochrona danych, kontrola dostępu, praktyki bezpieczeństwa, kopie, incydenty, szkolenia. Przegląd co najmniej raz w roku. Pozostali: nie dotyczy."]}, "3": {"t": ["Zapytaj o spis aktywów (systemy, dane, usługi, ludzie) i właścicieli. Wybierz dwa aktywa i sprawdź, czy właściciel o tym wie.", "Sprawdź, czy metodyka opisuje skale, kryteria akceptacji i powtarzalność ocen. Sygnał ostrzegawczy: kryteria akceptacji niezatwierdzone przez zarząd.", "Ustal datę analizy, uczestników i czas trwania. Analiza jednej osoby w kilka godzin bywa powierzchowna. Powinna być cykliczna i powtarzana po istotnych zmianach.", "Poproś o trzy najwyższe ryzyka i decyzje o nich (redukcja, akceptacja, transfer, unikanie). Porównaj z tym, co mówił zarząd.", "Sprawdź terminy, właścicieli, budżet i status działań. Sygnał ostrzegawczy: przeterminowane działania bez przeglądu.", "Cele mają być mierzalne, z właścicielem i terminem. Zapytaj, jak i jak często sprawdza się ich osiągnięcie (ISO 6.2, 9.1)."], "e": ["Sprawdź kolumny: nazwa, typ, właściciel, lokalizacja, klasyfikacja. Porównaj kilka pozycji z rzeczywistością, np. serwer z listy.", "Powinna zawierać identyfikację ryzyka, skale, kryterium akceptacji i częstotliwość przeglądów (ISO 6.1.2).", "Sprawdź: zagrożenie, podatność, aktywo, ocenę, właściciela ryzyka. Daty ocen powinny być aktualne.", "Powinien wynikać z rejestru, mieć zatwierdzenie właścicieli ryzyk i uwzględniać ryzyko szczątkowe (ISO 6.1.3).", "Zatwierdzone przez zarząd wraz z akceptacją ryzyka szczątkowego.", "Cele z miarami, terminami, właścicielem i wynikami ostatniego pomiaru."], "r": ["Szukaj powiązania ryzyk z kontekstem i wymaganiami stron zainteresowanych.", "Sprawdź skale, kryteria akceptacji, powtarzalność ocen i właścicieli ryzyk.", "Porównaj plan z rejestrem ryzyk: każde wysokie ryzyko ma decyzję, właściciela i termin.", "Sprawdź daty ostatnich ocen i wyzwalacze ponownej oceny: zmiana systemu, incydent, nowy dostawca.", "Sprawdź status działań i przeterminowania.", "Cel powinien mieć miarę, właściciela, termin i zasoby.", "Wybierz losowe aktywo i sprawdź obecność w rejestrze oraz wiedzę właściciela.", "Szukaj regulaminu użytkowania sprzętu, poczty, internetu, chmury i narzędzi generatywnej AI.", "Sprawdź schemat klasyfikacji i przykłady dokumentów oznaczonych różnymi klasami.", "Sprawdź oznaczenia na dokumentach i w systemach.", "Szukaj oceny ryzyka na starcie projektów i wymagań bezpieczeństwa w dokumentacji projektu.", "Sprawdź rejestr czynności przetwarzania, osobę odpowiedzialną za ochronę danych i spójność z polityką bezpieczeństwa."]}, "4": {"t": ["Zapytaj, co sprawdza się przed zatrudnieniem (referencje, dyplomy, niekaralność). Zakres musi być zgodny z prawem pracy i RODO. Ustawa przewiduje weryfikację niekaralności personelu wykonującego określone zadania (zweryfikuj zakres w tekście).", "Sprawdź klauzule poufności w umowach pracowników i współpracowników oraz NDA, a także czy obowiązują po ustaniu współpracy.", "Ustal kolejność: szkolenie wstępne, podpis poufności, dopiero potem dostęp. Sygnał ostrzegawczy: dostęp od pierwszego dnia bez szkolenia.", "Zapytaj o zakres, częstotliwość i grupy objęte szkoleniami (zarząd, IT, wszyscy) oraz o ostatni cykl i frekwencję.", "Sprawdź, kto i kiedy odbiera sprzęt, klucze i karty oraz blokuje konta. Czy jest karta obiegowa i kto informuje IT?", "Zapytaj o zasady VPN, szyfrowanie, prywatny sprzęt i ochronę ekranu w miejscach publicznych.", "Sprawdź regulamin i czy pracownicy znają konsekwencje naruszeń (ISO A.6.4). Poproś o przykład zastosowania."], "e": ["Szukaj klauzuli poufności i obowiązków bezpieczeństwa.", "Zakres, okres obowiązywania po ustaniu współpracy i konsekwencje naruszenia.", "Daty, tematy, listy obecności lub certyfikaty. Sprawdź, czy obejmują zarząd i nowych pracowników.", "Pola: sprzęt, klucze, karty, konta, podpisy. Sprawdź próbę trzech ostatnich odejść.", "Zapisy o monitoringu, konsekwencjach i ochronie informacji. Sprawdź, czy pracownicy zostali poinformowani.", "Wymagania techniczne i organizacyjne, zgody oraz wyposażenie pracowników zdalnych.", "Imienne upoważnienia z datami i zakresem; aktualne."], "r": ["Szukaj macierzy ról, opisów stanowisk i powołań: Pełnomocnik, właściciele aktywów, administratorzy.", "Przykład: ta sama osoba nie zatwierdza i nie wykonuje zmian w krytycznych systemach.", "Przewodnik NASK wymienia weryfikację niekaralności personelu wykonującego określone zadania. Zakres stanowisk i podstawę prawną zweryfikuj w ustawie.", "Sprawdź wzory umów i regulamin pracy.", "Szukaj wymagań kompetencyjnych, ocen i planu szkoleń zawodowych, np. dla IT.", "Zapytaj losowych pracowników o politykę i zgłaszanie zdarzeń.", "Szukaj planu komunikacji wewnętrznej i zewnętrznej.", "Sprawdź treści, częstotliwość, frekwencję i sprawdzenie wiedzy.", "Hasła, aktualizacje, phishing, bezpieczne urządzenia. Sprawdź kampanie symulacyjne lub zasady wewnętrzne.", "Sprawdź regulamin i przykład zastosowania.", "Sprawdź kartę obiegową i czas blokady kont.", "Sprawdź próbę trzech odejść: sprzęt, klucze, karty, dane.", "Sprawdź zakres, czas obowiązywania i przegląd wzorów.", "VPN, szyfrowanie, prywatny sprzęt, ochrona ekranu, zgłaszanie utraty."]}, "5": {"t": ["Poproś o prześledzenie jednego nowego konta od wniosku do pierwszego logowania. Kto wnioskuje, kto zatwierdza i jak przekazywane jest hasło?", "Zapytaj, gdzie są konta współdzielone i techniczne, kto je zna i jak zapewnia się rozliczalność.", "Porównaj politykę zapisaną z konfiguracją techniczną. Sygnał ostrzegawczy: wymagania tylko na papierze.", "Ustal, gdzie MFA działa: poczta, VPN, administratorzy, chmura. KSC wymienia MFA wśród środków (art. 8 ust. 1 pkt 2 lit. l wg NASK).", "Kto je ma, na jakiej podstawie, czy administratorzy mają osobne konta do codziennej pracy, czy działania są logowane.", "Zapytaj o ostatni przegląd uprawnień i czas blokady po odejściu. Sprawdź próbę kont byłych pracowników."], "e": ["Długość, złożoność, blokada, historia. Szukaj zrzutu z konsoli, nie samego dokumentu.", "Eksport z datą ostatniego logowania. Szukaj kont nieużywanych od dawna i kont osób, które odeszły.", "Imienna lista z uzasadnieniem. Porównaj z listą wyciągniętą z systemu.", "Odsetek użytkowników z MFA oraz wyjątki z uzasadnieniem.", "Losowo pięć kont: wniosek, zatwierdzenie, data nadania. Oceń zgodność z zasadą najmniejszych uprawnień.", "Data, zakres, uczestnicy, wynik i cofnięte uprawnienia.", "Porównaj datę odejścia z datą blokady konta. Każde opóźnienie to ryzyko; sprawdź, jaki czas dopuszcza procedura."], "r": ["Porównaj politykę z faktycznymi uprawnieniami w próbie.", "Prześledź jedno konto od wniosku do usunięcia.", "Hasła początkowe, zmiana, przechowywanie, menedżer haseł, brak haseł w plikach.", "Szukaj protokołu przeglądu uprawnień i opóźnień w blokadzie kont.", "Wykaz kont uprzywilejowanych, osobne konta administracyjne, logowanie działań.", "Role w aplikacjach, uprawnienia do katalogów, dostęp do danych wrażliwych.", "Dotyczy firm z własnym rozwojem oprogramowania. Pozostałe: nie dotyczy.", "Zgodne, gdy MFA obejmuje dostęp zdalny, administratorów i usługi chmurowe.", "Narzędzia administracyjne, skanery, edytory baz danych: kto ma do nich dostęp."]}, "6": {"t": ["Poproś o schemat: co lokalnie, co u dostawców, kto administruje. Wynik przyda się w obszarze dostawców.", "Sprawdź zasięg na stacjach i serwerach, aktualizacje, alerty i co dzieje się po wykryciu zagrożenia.", "Zapytaj o proces łatania i czasy zależne od krytyczności. Szukaj systemów bez wsparcia producenta.", "Zapora, segmentacja (goście, produkcja, biuro), Wi-Fi gościnne, VPN. Zapytaj o przegląd reguł.", "Dyski laptopów, nośniki USB, transmisja. Zapytaj o zarządzanie kluczami i odzyskiwanie.", "Uprawnienia lokalnego administratora, USB, instalowanie oprogramowania. Sygnał ostrzegawczy: wszyscy użytkownicy są lokalnymi administratorami."], "e": ["Aktualny, z segmentami i punktami dostępu zdalnego. Porównaj z wywiadem.", "Wersje, daty końca wsparcia, właściciele.", "Liczba stacji bez ochrony, wersje sygnatur, ostatnie wykrycia.", "Szukaj reguł zbyt szerokich, nieużywanych i dostępu z internetu do usług wewnętrznych.", "Zrzut ustawień szyfrowania i odsetek zaszyfrowanych urządzeń.", "Sprzęt z właścicielem oraz licencje z terminami. Wybierz losowy sprzęt do sprawdzenia na miejscu."], "r": ["Szyfrowana poczta lub kanały, zasady wysyłania danych wrażliwych, bezpieczne rozmowy i wideokonferencje.", "Alternatywny kanał łączności i kontakty awaryjne dostępne także bez systemów firmy.", "Porównaj ewidencję licencji z zainstalowanym oprogramowaniem.", "Sprawdź standard konfiguracji laptopów i telefonów, zarządzanie urządzeniami i zasady dla sprzętu prywatnego.", "Szukaj monitoringu miejsca na dyskach, wydajności i prognoz rozbudowy.", "Sprawdź zasięg ochrony na stacjach i serwerach, aktualizacje sygnatur i obsługę alertów.", "Szukaj skanów, rejestru podatności, terminów łatania i wyjątków. Sprawdź systemy bez wsparcia producenta.", "Szukaj standardów konfiguracji (hardening) i kontroli odchyleń.", "Zapytaj o usuwanie po okresie retencji i dowody usunięcia.", "Dotyczy danych osobowych w środowiskach testowych i raportach. Jeśli nie dotyczy, wpisz nie dotyczy.", "Sprawdź reguły poczty, USB, chmury i uprawnienia do eksportu danych.", "Jedno źródło czasu (NTP) dla serwerów i urządzeń, ważne przy analizie logów.", "Sprawdź zasady instalacji na serwerach i kto może instalować.", "Zapora, VPN, ochrona Wi-Fi. Sprawdź reguły i przeglądy konfiguracji urządzeń sieciowych.", "Sprawdź wymagania bezpieczeństwa i SLA wobec dostawców łączy i usług sieciowych.", "Szukaj podziału na strefy: biuro, goście, produkcja, serwery oraz reguł między nimi.", "Sprawdź filtrowanie stron, kategorie blokowane i wyjątki.", "Polityka, dopuszczone algorytmy, cykl życia kluczy, certyfikaty i ich terminy ważności.", "Dla firm bez własnego rozwoju oceń wymagania bezpieczeństwa przy zakupach i wdrożeniach.", "Szukaj wymagań bezpieczeństwa w specyfikacjach i zapytaniach ofertowych.", "Sprawdź dokumentację architektury i zasady, takie jak minimalne uprawnienia i obrona warstwowa.", "Dotyczy firm z własnym rozwojem. Szukaj standardów kodowania i przeglądów kodu.", "Szukaj planu testów, wyników i usuwania błędów przed uruchomieniem.", "Sprawdź dostęp i dane w środowiskach testowych.", "Sprawdź rejestr zmian, ocenę ryzyka, zatwierdzenie i plan wycofania.", "Sprawdź, czy w testach nie używa się kopii danych produkcyjnych bez ochrony.", "Szukaj uzgodnień zakresu i terminów testów penetracyjnych i audytów technicznych."]}, "7": {"t": ["Sprawdź, co jest w kopiach, a co nie (laptopy, usługi chmurowe, bazy). Poproś o listę.", "Zapytaj o częstotliwość, retencję i lokalizację. Porównaj z dopuszczalną utratą danych.", "Czy kopia przetrwałaby atak ransomware: odseparowana, niezmienna, z osobnymi poświadczeniami?", "Kiedy ostatnio odtwarzano dane i kto potrafi to zrobić. Nieprzetestowana kopia nie jest dowodem.", "Zapytaj o scenariusz: co firma robi, gdy kluczowy system nie działa przez dzień roboczy.", "RTO to dopuszczalny czas przestoju, RPO to dopuszczalna utrata danych. Powinny być uzgodnione z biznesem."], "e": ["Zrzut z zadaniami, harmonogramem i retencją.", "Sukcesy i błędy z ostatnich tygodni oraz reakcja na błędy.", "Data, zakres, czas odtworzenia, wynik i wnioski.", "Krok po kroku, dostępna także przy awarii głównych systemów.", "Procesy krytyczne, RTO i RPO, zależności; zatwierdzenie i test.", "Czas reakcji i naprawy, dostępność, zapisy o bezpieczeństwie."], "r": ["Sprawdź, jakie zabezpieczenia obowiązują w trybie awaryjnym i kto o tym decyduje.", "Szukaj BIA, uzgodnionych RTO i RPO oraz protokołów testów.", "Sprawdź zakres, częstotliwość, retencję, separację i protokół ostatniego odtworzenia.", "Szukaj zapasowych łączy, zasilania, klastrów i dowodów ich testów.", "Sprawdź listę kontaktów, role w kryzysie i ostatnie ćwiczenie z wnioskami."]}, "8": {"t": ["Poproś o listę dostawców z dostępem do systemów, danych i pomieszczeń: IT, sprzątanie, ochrona, księgowość.", "Sprawdź klauzule: poufność, zgłaszanie incydentów, prawo do audytu, zwrot lub usunięcie danych.", "Kto decyduje o nowej usłudze, gdzie są dane, czy oceniono ryzyko. Szukaj usług wprowadzonych bez wiedzy IT.", "Zapytaj, jak firma się dowie i w jakim czasie dostawca ma ją powiadomić. To wpływa na własne terminy zgłoszeń.", "Kryteria, częstotliwość i wyniki. Czy podjęto działania wobec słabych dostawców?"], "e": ["Dostawca, usługa, zakres dostępu, krytyczność, właściciel.", "Wybierz dwie lub trzy kluczowe umowy i sprawdź klauzule bezpieczeństwa.", "Wymagane przy powierzeniu danych osobowych. Porównaj z wykazem dostawców.", "Usługa, rodzaj danych, lokalizacja, właściciel, ocena ryzyka.", "Kwestionariusze, audyty, wnioski i daty.", "Pokazują wymagania klientów i dotychczasowe odpowiedzi. Sprawdź ich zgodność z rzeczywistością."], "r": ["Szukaj mapy łańcucha dostaw ICT i wymagań wobec dostawców wyższych rzędów.", "Sprawdź kryteria klasyfikacji dostawców i oceny przed zakupem. Ocena jednorazowa to uchybienie.", "Sprawdź klauzule: poufność, zgłaszanie incydentów, prawo do audytu, zwrot lub usunięcie danych.", "Szukaj przeglądów usług, raportów SLA i okresowej weryfikacji dostępów dostawców.", "Sprawdź ryzyko uzależnienia od jednego dostawcy i plan zmiany lub wyjścia.", "Sprawdź wykaz usług chmurowych, podział odpowiedzialności, lokalizację danych i procedurę wyjścia.", "Dotyczy firm zlecających rozwój. Szukaj wymagań w umowie, przeglądów kodu i odbiorów."]}, "9": {"t": ["Zapytaj pracownika, co zrobi po otrzymaniu podejrzanego maila i komu to zgłosi. Brak wiedzy to uchybienie.", "Zawartość rejestru: data, opis, klasyfikacja, działania, wnioski.", "Sprawdź kryteria klasyfikacji i kto decyduje oraz czy decyzja jest zapisana. Progi incydentu poważnego określa rozporządzenie Rady Ministrów, a zgłoszenie idzie do właściwego CSIRT przez System S46. Zweryfikuj aktualne kryteria.", "Jakie zdarzenia są rejestrowane, jak długo i czy logi są chronione przed zmianą.", "Kto, jak często i z jakim skutkiem. Sygnał ostrzegawczy: logi są zbierane, ale nikt ich nie czyta.", "Poproś o opis jednego incydentu z ostatniego roku, od wykrycia do wniosków."], "e": ["Role, etapy, kryteria, kontakty oraz zgłaszanie do CSIRT przez System S46 w trzech etapach: 24 godziny, 72 godziny, miesiąc.", "Wpisy z klasyfikacją i działaniami. Porównaj z przykładem z wywiadu.", "Dostępny dla każdego pracownika i prosty w użyciu.", "Zrzut z okresem przechowywania i zakresem logowania.", "Daty, osoba przeglądająca i wnioski.", "Pełny zapis: wykrycie, analiza, działania, wnioski i zmiany."], "r": ["Szukaj procedury, listy kontaktów i zespołu reagowania. Sprawdź, czy procedura była testowana.", "Progi incydentu poważnego określa rozporządzenie Rady Ministrów. Zweryfikuj aktualne kryteria.", "Poproś o przykład z ostatniego roku od wykrycia do zamknięcia.", "Sprawdź wnioski z incydentów i wprowadzone zmiany.", "Sprawdź zachowanie logów, obrazów dysków i łańcuch dowodowy.", "Zapytaj losowych pracowników, co zrobią po otrzymaniu podejrzanej wiadomości.", "Sprawdź zakres, retencję, ochronę logów przed zmianą i przeglądy.", "Szukaj narzędzi mon
